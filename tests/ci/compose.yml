services:
  upstream:
    image: node:22-alpine
    command: [node, /fixture/upstream.mjs]
    volumes:
      - ./upstream.js:/fixture/upstream.mjs:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 20

  frontend:
    image: ${WASHGO_FE_CI_IMAGE:-washgo-fe-ci-local:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://upstream:8080
    depends_on:
      upstream:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WASHGO_FE_CI_PORT:-5380}:80"
